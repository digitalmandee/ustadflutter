name: flutterustad
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.3+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  logger: ^2.0.1
  dio: ^5.8.0+1
  shared_preferences: ^2.2.0
  intl: ^0.20.2
  fluttertoast: ^8.2.12
  file_picker: ^11.0.2
  image_picker: ^1.2.1
  
  connectivity_plus: ^7.0.0
  cached_network_image: ^3.4.1
  password_strength_indicator: ^1.0.1
  open_filex: ^4.7.0
  country_picker: ^2.0.27
  pin_code_fields: ^8.0.1
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
 
  phone_form_field: ^10.0.8
  provider: ^6.1.5
  fl_chart: ^0.71.0
  socket_io_client: ^3.1.2
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  permission_handler: ^12.0.1
  dropdown_button2: ^2.3.9
  flutter_staggered_grid_view: ^0.7.0
  record: ^6.1.1
  
  audio_waveforms: ^1.3.0
  firebase_core: ^4.8.0
  
  google_sign_in: ^7.2.0
  firebase_messaging: ^16.2.1
  flutter_local_notifications: ^21.0.0
  audioplayers: ^6.5.1
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.10.11
 
  another_flushbar: ^1.12.32
  http_parser: ^4.1.2
  rename: ^3.1.0
  cloud_firestore: ^6.4.0
  flutter_screenutil: ^5.9.3
  sign_in_with_apple: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/banks.json
    - assets/subjects.json
    - assets/images/Banks/
    - assets/images/Books/
    - assets/sounds/msg_beep.mp3

  fonts:
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/InstrumentSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/InstrumentSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/InstrumentSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InstrumentSans-Bold.ttf
          weight: 700